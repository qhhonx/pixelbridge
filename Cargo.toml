[package]
name = "pixelbridge"
version = "0.1.0-beta.4"
edition = "2021"
description = "Prepare Apple Live Photos for Google Photos backup through a first-generation Pixel"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
serde_json = "1.0.151"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
