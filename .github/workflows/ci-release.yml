name: Check, build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixelbridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test && npm run build
        working-directory: site
      - run: python3 scripts/audit-public.py
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: rustup show
      - run: cargo test --locked
      - run: ./scripts/test-macos.sh
      - run: ./scripts/build-macos-app.sh
      - run: python3 tests/sparkle_integration.py
      - run: python3 tests/transport_scenarios.py
      - run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pixelbridge-macos
          path: dist/release/
          retention-days: 14
          if-no-files-found: error
  release:
    if: vars.ENABLE_RELEASE_PUBLISHING == 'true' && github.event.repository.private == false && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [website, app]
    concurrency:
      group: pixelbridge-release
      cancel-in-progress: false
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Determine whether this version is already published
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-version.py
          tag="v$(cat VERSION)"
          # A successful list distinguishes an absent release from authentication/network errors.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - "$tag" "$RUNNER_TEMP/releases.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          existing=[r for r in json.load(open(sys.argv[2])) if r['tag_name']==sys.argv[1]]
          print('publish='+('true' if not existing or existing[0]['draft'] else 'false'))
          PY
      - if: steps.version.outputs.publish == 'true'
        run: python3 scripts/check-release-order.py "$RUNNER_TEMP/releases.json"
      - name: Fetch verified signing tools
        run: ./scripts/fetch-dependencies.sh
      - name: Validate release signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo '::error::Configure the SPARKLE_PRIVATE_KEY repository secret before enabling releases.'
            exit 1
          fi
          export SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle-preflight-key"
          trap 'rm -f "$SPARKLE_KEY_FILE"' EXIT
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"
          ./scripts/check-signing-key.sh
      - name: Keep the existing release unchanged
        if: steps.version.outputs.publish != 'true'
        run: |
          echo "Version $(cat VERSION) is already published. Signing configuration passed; existing release assets were not changed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: pixelbridge-macos
          path: dist/release
      - name: Sign update and validate release
        if: steps.version.outputs.publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          export SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle-key"
          trap 'rm -f "$SPARKLE_KEY_FILE"' EXIT
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"
          ./scripts/sign-release.sh
      - name: Publish complete beta or stable release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "PixelBridge $tag" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$tag" dist/release/*.zip dist/release/SHA256SUMS dist/release/appcast.xml --clobber
          case "$tag" in
            *-beta.*) gh release edit "$tag" --draft=false --prerelease ;;
            *) gh release edit "$tag" --draft=false --latest ;;
          esac
